name: Deploy static landing page to GitHub Pages

# Publishes the self-contained static page in ./site to GitHub Pages.
# This is a lightweight landing page only — the full Next.js app (pages +
# /api/* route handlers) is deployed separately to Cloud Run (see
# deploy-cloudrun.yml). The Next app is NOT statically exported here.
#
# One-time: Repo → Settings → Pages → Build and deployment → Source:
# "GitHub Actions". (configure-pages below will enable it if permitted.)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
