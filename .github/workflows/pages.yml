name: Deploy static landing page to GitHub Pages

# Publishes the self-contained static page in apps/web/site to GitHub Pages.
# This is a lightweight landing page only — the full Next.js app (pages +
# /api/* route handlers) is deployed separately to Cloud Run (see
# deploy-cloudrun.yml). The Next app is NOT statically exported here.
#
# One-time: Repo → Settings → Pages → Build and deployment → Source:
# "GitHub Actions". (configure-pages below will enable it if permitted.)

on:
  push:
    branches: [main]
    # These paths must cover every input the guard below actually reads, not
    # just the directory being published. `landing-page.test.ts` imports
    # SITE_URL from src/lib/route-meta.ts and byte-compares site/<asset>
    # against public/<asset> — so a change to either could invalidate the
    # published page while this workflow sat idle.
    #
    # The concrete failure that motivated widening this: `bun run og`
    # regenerates the raster brand assets into public/ ONLY (it has no site/
    # step). After a re-skin, site/ silently keeps the old artwork. With the
    # old filter nothing ran, Pages kept serving stale branding, and the drift
    # surfaced later as a confusing failure on the next unrelated site/ commit.
    #
    # Listed asset-by-asset rather than as `public/**`: only these three are
    # duplicated into site/, and a bare wildcard would rebuild the landing page
    # on every unrelated public/ change (mirrored WDBX docs, research PDFs).
    paths:
      - "apps/web/site/**"
      - "apps/web/src/__tests__/landing-page.test.ts"
      - "apps/web/src/lib/route-meta.ts"
      - "apps/web/public/favicon.svg"
      - "apps/web/public/og-image.png"
      - "apps/web/public/apple-touch-icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Gate the publish on the landing-page drift guard
      # (src/__tests__/landing-page.test.ts): canonical URL, complete social
      # card, brand assets physically present in site/, no /_next/ or
      # /public/ paths Pages can't serve. Cheap insurance — this page is
      # hand-maintained and duplicates brand/copy from the Next app.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bunx vitest run src/__tests__/landing-page.test.ts
        working-directory: apps/web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/site
      - id: deployment
        uses: actions/deploy-pages@v4
