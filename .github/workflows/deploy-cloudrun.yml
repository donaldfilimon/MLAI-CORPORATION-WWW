name: Deploy to Cloud Run

# The full Next.js app is built into an immutable Artifact Registry image and
# deployed only after CI validates a push from this repository's main branch.
# OpenTofu in apps/web/infra/ owns the load balancer, Cloud Armor origin ACL, Cloud SQL,
# KMS, Secret Manager containers, service accounts, and GitHub OIDC provider.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Keep all three workflow_run checks. The repository-identity check is the
    # boundary that prevents a fork's attacker-controlled branch name and SHA
    # from receiving production deployment context. Manual dispatch remains a
    # deliberate maintainer-only exception.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      )
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run otherwise checks out a potentially newer main HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate production configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
          APP_URL: ${{ vars.APP_URL }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_USER: ${{ vars.DATABASE_USER }}
          WORKOS_ORGANIZATION_ID: ${{ vars.WORKOS_ORGANIZATION_ID }}
          WORKOS_MFA_POLICY_VERIFIED: ${{ vars.WORKOS_MFA_POLICY_VERIFIED }}
          WORKOS_SSO_MFA_POLICY_VERIFIED: ${{ vars.WORKOS_SSO_MFA_POLICY_VERIFIED }}
          CLOUDFLARE_AI_GATEWAY_URL: ${{ vars.CLOUDFLARE_AI_GATEWAY_URL }}
          CLOUDFLARE_AI_GATEWAY_ID: ${{ vars.CLOUDFLARE_AI_GATEWAY_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_HOSTNAMES: ${{ vars.TURNSTILE_HOSTNAMES }}
          AUDIT_KMS_KEY_NAME: ${{ vars.AUDIT_KMS_KEY_NAME }}
          AUDIT_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.AUDIT_SCHEDULER_SERVICE_ACCOUNT }}
          AUDIT_SCHEDULER_AUDIENCE: ${{ vars.AUDIT_SCHEDULER_AUDIENCE }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
        run: |
          set -euo pipefail
          REQUIRED=(
            GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE ARTIFACT_REPOSITORY
            APP_URL RUNTIME_SA CLOUD_SQL_CONNECTION_NAME DATABASE_NAME DATABASE_USER
            WORKOS_ORGANIZATION_ID WORKOS_MFA_POLICY_VERIFIED WORKOS_SSO_MFA_POLICY_VERIFIED CLOUDFLARE_AI_GATEWAY_URL CLOUDFLARE_AI_GATEWAY_ID
            NEXT_PUBLIC_TURNSTILE_SITE_KEY TURNSTILE_HOSTNAMES AUDIT_KMS_KEY_NAME
            AUDIT_SCHEDULER_SERVICE_ACCOUNT AUDIT_SCHEDULER_AUDIENCE
            WIF_PROVIDER DEPLOYER_SA
          )
          for name in "${REQUIRED[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production variable ${name} is unset."
              exit 1
            fi
          done
          if [ "${APP_URL}" != "https://quesar.cloud" ]; then
            echo "::error::APP_URL must be the canonical https://quesar.cloud origin."
            exit 1
          fi
          if [ "${WORKOS_MFA_POLICY_VERIFIED}" != "true" ]; then
            echo "::error::WORKOS_MFA_POLICY_VERIFIED must be true after manual production-policy verification."
            exit 1
          fi
          case "${WORKOS_SSO_MFA_POLICY_VERIFIED}" in
            true|false) ;;
            *)
              echo "::error::WORKOS_SSO_MFA_POLICY_VERIFIED must be explicitly true or false."
              exit 1
              ;;
          esac
          if [[ ",${TURNSTILE_HOSTNAMES}," == *",localhost,"* ]] || [[ ",${TURNSTILE_HOSTNAMES}," == *",127.0.0.1,"* ]]; then
            echo "::error::Production TURNSTILE_HOSTNAMES may not contain a local hostname."
            exit 1
          fi

          REQUIRED_SECRETS=(
            WORKOS_API_KEY WORKOS_CLIENT_ID SESSION_SECRET DATABASE_PASSWORD
            CLOUDFLARE_AI_GATEWAY_TOKEN AUDIT_SUBJECT_PEPPER TURNSTILE_SECRET ADMIN_EMAILS
          )
          for secret in "${REQUIRED_SECRETS[@]}"; do
            gcloud secrets versions describe latest \
              --secret "${secret}" --project "${GCP_PROJECT_ID}" >/dev/null
          done

      - name: Build and push immutable image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          IMAGE="${REGISTRY}/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${CLOUD_RUN_SERVICE}:${VALIDATED_SHA}"
          gcloud auth configure-docker "${REGISTRY}" --quiet
          docker build --pull \
            --file apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}" \
            --label "org.opencontainers.image.revision=${VALIDATED_SHA}" \
            --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy hardened Cloud Run revision
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          APP_URL: ${{ vars.APP_URL }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_USER: ${{ vars.DATABASE_USER }}
          WORKOS_ORGANIZATION_ID: ${{ vars.WORKOS_ORGANIZATION_ID }}
          WORKOS_MFA_POLICY_VERIFIED: ${{ vars.WORKOS_MFA_POLICY_VERIFIED }}
          WORKOS_SSO_MFA_POLICY_VERIFIED: ${{ vars.WORKOS_SSO_MFA_POLICY_VERIFIED }}
          CLOUDFLARE_AI_GATEWAY_URL: ${{ vars.CLOUDFLARE_AI_GATEWAY_URL }}
          CLOUDFLARE_AI_GATEWAY_ID: ${{ vars.CLOUDFLARE_AI_GATEWAY_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_HOSTNAMES: ${{ vars.TURNSTILE_HOSTNAMES }}
          AUDIT_KMS_KEY_NAME: ${{ vars.AUDIT_KMS_KEY_NAME }}
          AUDIT_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.AUDIT_SCHEDULER_SERVICE_ACCOUNT }}
          AUDIT_SCHEDULER_AUDIENCE: ${{ vars.AUDIT_SCHEDULER_AUDIENCE }}
        run: |
          set -euo pipefail
          # The custom @ delimiter is intentional: TURNSTILE_HOSTNAMES itself
          # contains a comma and gcloud's default dict parser would split it.
          ENV_VARS="^@^NODE_ENV=production@APP_URL=${APP_URL}@CLOUD_SQL_CONNECTION_NAME=${CLOUD_SQL_CONNECTION_NAME}@DATABASE_NAME=${DATABASE_NAME}@DATABASE_USER=${DATABASE_USER}@DATABASE_POOL_SIZE=5@WORKOS_ORGANIZATION_ID=${WORKOS_ORGANIZATION_ID}@WORKOS_MFA_POLICY_VERIFIED=${WORKOS_MFA_POLICY_VERIFIED}@WORKOS_SSO_MFA_POLICY_VERIFIED=${WORKOS_SSO_MFA_POLICY_VERIFIED}@CLOUDFLARE_AI_GATEWAY_URL=${CLOUDFLARE_AI_GATEWAY_URL}@CLOUDFLARE_AI_GATEWAY_ID=${CLOUDFLARE_AI_GATEWAY_ID}@NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}@TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES}@AUDIT_KMS_KEY_NAME=${AUDIT_KMS_KEY_NAME}@AUDIT_SCHEDULER_SERVICE_ACCOUNT=${AUDIT_SCHEDULER_SERVICE_ACCOUNT}@AUDIT_SCHEDULER_AUDIENCE=${AUDIT_SCHEDULER_AUDIENCE}@ADMIN_REQUIRE_MFA=true"
          SECRETS="WORKOS_API_KEY=WORKOS_API_KEY:latest,WORKOS_CLIENT_ID=WORKOS_CLIENT_ID:latest,SESSION_SECRET=SESSION_SECRET:latest,DATABASE_PASSWORD=DATABASE_PASSWORD:latest,CLOUDFLARE_AI_GATEWAY_TOKEN=CLOUDFLARE_AI_GATEWAY_TOKEN:latest,AUDIT_SUBJECT_PEPPER=AUDIT_SUBJECT_PEPPER:latest,TURNSTILE_SECRET=TURNSTILE_SECRET:latest,ADMIN_EMAILS=ADMIN_EMAILS:latest"

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --service-account "${RUNTIME_SA}" \
            --allow-unauthenticated \
            --ingress internal-and-cloud-load-balancing \
            --no-default-url \
            --add-cloudsql-instances "${CLOUD_SQL_CONNECTION_NAME}" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 40 \
            --timeout 60 \
            --min-instances 0 \
            --max-instances 10 \
            --cpu-boost \
            --set-env-vars "${ENV_VARS}" \
            --set-secrets "${SECRETS}" \
            --quiet

      - name: Verify deployed control plane
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format=json)"
          python3 -c 'import json,sys; s=json.load(sys.stdin); assert s.get("metadata",{}).get("annotations",{}).get("run.googleapis.com/ingress") == "internal-and-cloud-load-balancing"; assert s.get("metadata",{}).get("annotations",{}).get("run.googleapis.com/default-url-disabled") == "true"' <<<"${SERVICE_JSON}"
          echo "Cloud Run ingress is load-balancer-only and the default run.app URL is disabled."
