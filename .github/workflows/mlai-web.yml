# Checks for the mlai-web static site. Build verification only — this workflow
# never deploys and never commits. Publishing is deliberately not wired up here;
# see mlai-web/NOTES.md for why, and for what deploying from this repo would take.
name: mlai-web

on:
  push:
    branches: [main]
    paths: ["mlai-web/**", ".github/workflows/mlai-web.yml"]
  pull_request:
    paths: ["mlai-web/**", ".github/workflows/mlai-web.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: mlai-web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify the static export
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          test -f docs/.nojekyll || { echo "docs/.nojekyll missing"; exit 1; }
          test -f docs/sitemap.xml || { echo "docs/sitemap.xml missing"; exit 1; }
          for route in architecture wdbx abi abbey docs company legal/terms legal/privacy; do
            test -f "docs/$route/index.html" || { echo "route $route did not render"; exit 1; }
          done
          echo "all 11 routes rendered"
