name: CI

# Gate on the exact commands documented in CLAUDE.md/README: type-check,
# Vitest suite, then a full production build (which also regenerates
# public/sitemap.xml — this catches sitemap/content drift too). Runs on
# every push and PR against main; nothing merges without all three green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
