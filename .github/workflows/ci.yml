name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun run check:topology
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - run: bun run check:workflows
      - run: bun run check:tooling

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run lint
        working-directory: apps/web
      - run: bun run test
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run typecheck
        working-directory: apps/mobile
      - run: bun run test -- --runInBand
        working-directory: apps/mobile
      - run: bun run lint
        working-directory: apps/mobile
      - run: bunx expo export --platform web
        working-directory: apps/mobile

  quasar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: apps/quasar
      - run: bun run typecheck
        working-directory: apps/quasar
      - run: bun run test
        working-directory: apps/quasar
      - run: bunx expo export --platform web
        working-directory: apps/quasar/apps/quasar

  website-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website-app
    steps:
      - uses: actions/checkout@v7
      - name: Initialize isolated application data
        run: echo "MLAI_DATA_DIR=$RUNNER_TEMP/mlai-website-app-ci" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run verify:research
      - run: bun run test
      # Migrate once before parallel Next build workers import the database.
      - run: bun run db:migrate
      - run: bun run build
