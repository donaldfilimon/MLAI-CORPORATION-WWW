name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun run check:topology

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run lint
        working-directory: apps/web
      - run: bun run test
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run typecheck
        working-directory: apps/mobile
      - run: bun run test -- --runInBand
        working-directory: apps/mobile
      - run: bun run lint
        working-directory: apps/mobile
      - run: bunx expo export --platform web
        working-directory: apps/mobile

  quasar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: apps/quasar
      - run: bun run typecheck
        working-directory: apps/quasar
      - run: bun run test
        working-directory: apps/quasar
      - run: bunx expo export --platform web
        working-directory: apps/quasar/apps/quasar
