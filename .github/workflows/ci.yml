name: CI

# Trusted same-repository events also run the full gate on the macOS arm64
# self-hosted runner (the `check (self-hosted)` job). Fork pull requests never
# reach that machine; they run only on the GitHub-hosted jobs below.
# Runner operations and security model: .github/self-hosted-runner.md
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every app installs through the one root Bun workspace (root bun.lock,
# isolated linker in bunfig.toml). Each job installs at the repository root,
# filtered to the workspaces it checks; @mlai/platform (the root workspace)
# carries the @types/react fallback that Next's declarations resolve through.
jobs:
  check-self-hosted:
    name: check (self-hosted)
    if: >
      github.repository == 'donaldfilimon/MLAI-CORPORATION-WWW' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, mlai]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      # Same drift check as the hosted topology job, then the full install.
      - run: bun install --frozen-lockfile --lockfile-only
      - run: bun install --frozen-lockfile
      # Topology, workflows, tooling, the one Next app, and the Quasar sidecar.
      # check:workflows uses the host's Go (1.25+).
      - run: bun run check

  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun run check:topology
      # Lockfile drift: a manifest change without the matching bun.lock update
      # fails here ("lockfile had changes, but lockfile is frozen").
      - run: bun install --frozen-lockfile --lockfile-only
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - run: bun run check:workflows
      - run: bun run check:tooling

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --filter @mlai/platform --filter @quesar/web
      - run: bun run lint
        working-directory: apps/mlai
      - run: bun run test
        working-directory: apps/mlai
      - run: bun run build
        working-directory: apps/mlai

  quasar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --filter @mlai/platform --filter quasar --filter '@quasar/*'
      - run: bun run typecheck
        working-directory: apps/quasar
      - run: bun run test
        working-directory: apps/quasar
