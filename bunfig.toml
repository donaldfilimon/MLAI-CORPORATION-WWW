# One root Bun workspace (see AGENTS.md). The isolated linker gives every
# workspace its own node_modules view. Never switch to "hoisted" without
# re-running the app typecheck.
#
# hoistPattern keeps React's type packages out of Bun's hidden fallback
# directory (node_modules/.bun/node_modules). Packages such as next import
# "react" in their declarations without depending on @types/react, so
# TypeScript falls back to whatever that directory holds. With these two names
# excluded, the lookup continues to the root node_modules, where the root
# package.json pins the Next app's React types.
[install]
linker = "isolated"
hoistPattern = ["*", "!@types/react", "!@types/react-dom"]
